openapi: 3.0.3
info:
  title: ParkWith API
  version: 0.1.0
paths:
  /venues:
    get:
      summary: List venues
      responses:
        "200":
          description: Venue list response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueListResponse"
  /venues/{venueId}:
    get:
      summary: Get venue detail
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Venue detail response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueDetailResponse"
  /venues/{venueId}/deals:
    get:
      summary: List venue deals
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Venue deal list response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealListResponse"
  /trip-rooms:
    post:
      summary: Create a trip room
      responses:
        "201":
          description: Trip room created
  /trip-rooms/{tripRoomId}/location:
    post:
      summary: Update current location snapshot
      parameters:
        - name: tripRoomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Location snapshot updated
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    Venue:
      type: object
      required:
        - id
        - name
        - nameKo
        - category
        - region
        - description
      properties:
        id:
          type: string
          example: caribbean-bay
        name:
          type: string
          example: Caribbean Bay
        nameKo:
          type: string
          example: 캐리비안 베이
        category:
          type: string
          enum:
            - water_park
            - amusement_park
        region:
          type: string
          example: Yongin
        description:
          type: string
          example: Large water park next to Everland.
    VenueListResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Venue"
        error:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ApiError"
    Deal:
      type: object
      required:
        - id
        - venueId
        - title
        - summary
        - discountText
        - sourceUrl
        - lastUpdatedAt
      properties:
        id:
          type: string
          example: everland-afternoon-pass
        venueId:
          type: string
          example: everland
        title:
          type: string
          example: Afternoon pass discount
        summary:
          type: string
          example: Reduced admission after afternoon entry hours.
        discountText:
          type: string
          example: Up to 35% off selected afternoon passes
        sourceUrl:
          type: string
          format: uri
          example: https://www.everland.com/
        lastUpdatedAt:
          type: string
          format: date
          example: "2026-06-30"
    DealListResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Deal"
        error:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ApiError"
    VenueDetailResponse:
      oneOf:
        - type: object
          required:
            - success
            - data
            - error
          properties:
            success:
              type: boolean
              enum:
                - true
            data:
              $ref: "#/components/schemas/Venue"
            error:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/ApiError"
        - type: object
          required:
            - success
            - data
            - error
          properties:
            success:
              type: boolean
              enum:
                - false
            data:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/Venue"
            error:
              $ref: "#/components/schemas/ApiError"
